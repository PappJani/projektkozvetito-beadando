name: Java CI with Maven

# Megmondjuk, hogy mikor induljon el a robot: minden 'main' ágra történő push esetén
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Egy tiszta, legfrissebb Ubuntu Linux szervert kérünk a GitHubtól
    runs-on: ubuntu-latest

    steps:
      # 1. Lépés: Letölti a kódodat a GitHub repóból a Linux szerverre
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Lépés: Telepíti a Java 21-et (Temurin disztribúciót), pontosan azt, amit te is használsz
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Gyorsítótárazza a Maven függőségeket, hogy legközelebb gyorsabb legyen

      # 3. Lépés: Lefuttatja az egyedi Checkstyle ellenőrzésünket
      - name: Run Checkstyle check
        run: ./mvnw checkstyle:check

      # 4. Lépés: Lefuttatja a Unit teszteket és legenerálja a Jacoco riportot
      - name: Run Unit Tests with Jacoco
        run: ./mvnw test